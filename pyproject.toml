[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-framework"
version = "2.0.0"
description = "Production-grade PyTorch Lightning framework for tabular, image, and mixed data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML Framework" }]
keywords = ["pytorch", "lightning", "mlops", "tabular", "training"]

# Deliberately free of any ML runtime. torch/Lightning moved to the `lightning`
# extra in P3: they are the dependency of one *backend*, not of the framework, and
# leaving them here put 533 MB into a GBDT serving image that never imports them.
# Everything below is needed to read a table, split it, and load a bundle.
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "imbalanced-learn>=0.11.0",
    "joblib>=1.3.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The deep-learning runtime. Required by the `lightning` backend and therefore by
# the mlp/cnn plugins, which declare it — so on an install without this extra they
# are *listed* by `mlf models` and refuse selection with a pip command, rather
# than vanishing. `image` extends this with torchvision; installing `image`
# without `lightning` gets you torchvision's own torch, which is why they are
# documented as a pair.
lightning = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
]
# Deliberately an unbounded floor, despite the sharp edge: every torchvision
# release pins ONE torch patch exactly (0.25.0 requires torch==2.10.0; the pairing
# is torch 2.N <-> torchvision 0.(N+15)). An upper bound here would therefore pin
# the *user's* torch too, contradicting `torch>=2.0.0` above and making the package
# uninstallable next to any other torch.
#
# The consequence to know about: `pip install -e '.[image]'` resolves the newest
# torchvision and will replace an older torch to match it, with no warning and a
# multi-GB download. Install torch and torchvision together from the same index
# when you care which build you get — that is what CI does, and it is an
# environment concern, not something package metadata can express.
image = ["torchvision>=0.15.0", "Pillow>=9.0.0"]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]
hpo = ["optuna>=3.4.0", "optuna-integration[pytorch_lightning]>=3.4.0"]
# Model families beyond the Lightning path. The extra NAMES are load-bearing:
# `Requirement.extra` is interpolated verbatim into the MissingExtraError hint, so
# renaming one here breaks the `pip install 'ml-framework[…]'` message users are
# told to run. Backends/plugins for these land in P3 (gbdt), P6 (timeseries) and
# P7 (nlp); the extras are declared now so the error messages are already truthful.
gbdt = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
timeseries = ["statsmodels>=0.14", "prophet>=1.1"]
nlp = ["transformers>=4.40", "tokenizers", "datasets"]
# `onnxscript` is required by the dynamo ONNX exporter, which is torch 2.9+'s
# default and the only one with a future — the TorchScript exporter it replaced is
# deprecated and unsupported on Python 3.14+. Declared rather than relied upon:
# leaving it out is what forced `dynamo=False` in `backends/lightning.py`, and a
# machine that happens to have it installed transitively would have hidden that.
export = ["onnx", "onnxruntime", "onnxscript>=0.7", "skl2onnx"]
# Parquet ingestion. Declared even though `mlflow` happens to require pyarrow
# unconditionally: relying on that is a hidden coupling, and it breaks exactly
# where it matters most — a slim serving image built without the mlops extra.
parquet = ["pyarrow>=10.0.1"]
diagnostics = ["torch-lr-finder>=0.2.1", "matplotlib>=3.7.0"]
logging = ["wandb>=0.15.0"]
# Production MLOps stack. (Airflow is installed separately with its own
# constraints file / container — see orchestration/airflow — not pinned here.)
mlops = [
    "mlflow>=2.9.0",
    "dvc[s3]>=3.0.0",
    "pyspark>=3.5.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]
# Serving hardening: rate limiting + multi-worker production server.
security = [
    "slowapi>=0.1.9",
    "gunicorn>=21.2.0",
]
# Drift detection + data contracts.
monitoring = [
    "scipy>=1.11.0",
    "pandera>=0.18.0",
]
dev = [
    "pytest>=7.4.0",
    # The full toolkit: `dev` installs every runtime so the whole suite runs
    # rather than importorskip-ing half of it.
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torchmetrics>=1.0.0",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    # The NLP tests fine-tune a ~90 KB random DistilBert from the hub rather than
    # importorskip-ing themselves away. They need network on the first run only.
    "transformers>=4.40",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "fastapi>=0.110.0",
    "torchvision>=0.15.0",  # see the pairing note on the `image` extra above
    "mlflow>=2.9.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
    "slowapi>=0.1.9",
    "scipy>=1.11.0",
    "pandera>=0.18.0",
    "pyarrow>=10.0.1",  # so the parquet tests run rather than importorskip away
]

[project.scripts]
mlf = "ml_framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = ["E501"]

[tool.mypy]
# 3.12 needed to parse PEP 695 `type` statements in numpy 2.x stubs; the runtime
# still supports 3.10+ (code uses only 3.10-compatible syntax).
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/load"   # load scripts (locust/k6) run out-of-band
markers = [
    "unit: fast isolated tests",
    "integration: end-to-end training tests",
    "serving: FastAPI endpoint tests",
]


[tool.coverage.run]
source = ["ml_framework"]
# The generated-code and __main__ paths are not what the floor is about.
omit = ["*/__main__.py"]

[tool.coverage.report]
# Matches the CI gate, so `pytest --cov` locally fails for the same reason CI
# does rather than passing quietly and being a surprise on push.
fail_under = 80
show_missing = true
exclude_also = [
    # A `Protocol` body is a signature, not code that can run.
    '^\s*\.\.\.$',
    'if TYPE_CHECKING:',
    'raise NotImplementedError',
]
