# ── Example tabular experiment config (schema v2) ────────────────────
# This is the only file you edit per project (plus optional custom plugins).
# Load with:  mlf train --config configs/example_tabular.yaml
# Coming from a v1 config?  mlf migrate-config -i old.yaml -o new.yaml

task: multiclass          # binary | multiclass | regression

runtime:
  seed: 42
  output_dir: outputs
  num_workers: -1                   # -1 → auto (0 on Windows, 4 elsewhere)
  accelerator: auto
  devices: auto
  precision: "32"                   # 32 | 16-mixed | bf16-mixed (16/bf16 also accepted)
  strategy: auto                    # auto | ddp | ddp_spawn
  deterministic: true

data:
  kind: tabular
  path: data.csv                    # CSV, Parquet file, or Parquet directory
  target: label
  # class_names: [cat, dog, bird]   # optional, for readable reports
  split:
    strategy: auto                  # auto | random | temporal | group
    val_size: 0.15
    test_size: 0.15
    # time_col: date                # set → `auto` becomes a temporal split
    # group_col: patient_id         # set → `auto` becomes a grouped split
    gap: 0
    folds: 0                        # >= 2 → k-fold CV before the final fit
  params:                           # validated by the tabular source
    imbalance_strategy: smote       # smote | class_weights | none
    imbalance_threshold: 0.3
    holdout_threshold: 5000         # n >= this → holdout, else KFold-derived split

model:
  name: mlp                         # registry key (mlp | cnn)
  params:                           # validated by the plugin's own schema
    hidden_dims: [128, 64, 32]      # paste tuned values from `mlf hpo`
    dropout: 0.3

fit:
  budget:
    max_epochs: 200
    max_seconds: null
  patience: 20                      # early stopping
  batch_size: 32
  params:                           # validated by the backend (lightning)
    lr: 0.001                       # paste tuned value from `mlf lr`
    weight_decay: 0.0001
    optimizer: adam                 # adam | adamw | sgd
    scheduler: plateau              # plateau | cosine | step | none
    lr_patience: 10                 # ReduceLROnPlateau
    lr_factor: 0.5
    gradient_clip_val: 1.0
    accumulate_grad_batches: 1      # effective batch = batch_size * this

tune:
  enabled: true
  max_trials: 20
  max_seconds: 900
  metric: null                      # null → the task's primary metric
  refit: best                       # best | reuse
  overrides: {}                     # narrow a plugin's declared search space

logging:
  backend: csv                      # wandb | csv | mlflow | none
  wandb_project: my-project
  wandb_run: run-01
  log_model: false
