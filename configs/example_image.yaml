# ── Example image experiment config (schema v2) ──────────────────────
# Load with:  mlf train --config configs/example_image.yaml
#
# Two v1 keys are deliberately gone, and both were dead settings the shared v1
# ModelConfig/DataConfig carried for every run regardless of kind:
#   * model.dropout            — the CNN never read it
#   * data.imbalance_strategy  — the image path corrects imbalance with a
#                                WeightedRandomSampler regardless of its value
# The per-plugin, per-source schemas now say so instead of accepting them.

task: multiclass

runtime:
  seed: 42
  output_dir: outputs
  num_workers: -1
  deterministic: true

data:
  kind: image
  path: data/train             # the training image folder (ImageFolder layout)
  split:
    val_size: 0.15             # used only when params.val_dir is absent
    test_size: 0.15
  params:                      # validated by the image source
    test_dir: data/test
    # val_dir: data/val        # optional — auto-split from `path` if absent
    img_size: 224

model:
  name: cnn
  params:
    backbone: resnet18         # torchvision backbone
    pretrained: true

fit:
  budget:
    max_epochs: 50
  patience: 10
  batch_size: 32
  params:
    lr: 0.0003
    weight_decay: 0.0001
    lr_patience: 5
    lr_factor: 0.5
    gradient_clip_val: 1.0

logging:
  backend: csv
  wandb_project: my-image-project
  wandb_run: run-01
  log_model: false
