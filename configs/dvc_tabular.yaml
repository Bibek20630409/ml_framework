# Config used by the DVC `train` stage (schema v2). Reads the Spark-produced
# Parquet dataset and logs/registers the model in MLflow.
task: multiclass

runtime:
  seed: 42
  output_dir: outputs
  num_workers: -1

data:
  kind: tabular
  path: data/processed            # a directory of Parquet part-files (Spark output)
  target: label
  params:
    imbalance_strategy: smote

model:
  name: mlp
  params:
    hidden_dims: [64, 32]
    dropout: 0.3

fit:
  budget:
    max_epochs: 20
  patience: 8
  batch_size: 32
  params:
    lr: 0.001
    weight_decay: 0.0001

logging:
  backend: mlflow
  mlflow_tracking_uri: sqlite:///mlflow.db   # prod: http://mlflow:5000
  mlflow_experiment: ml-framework
  registered_model_name: ml-framework
