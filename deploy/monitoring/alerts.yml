# Prometheus alerting rules for the ML Framework serving API.
# Load via `rule_files: [alerts.yml]` in prometheus.yml; route to AlertManager.
groups:
  - name: ml-framework-serving
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
          / sum(rate(http_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "High 5xx error rate (>5%)"
          description: "The inference API is returning >5% server errors over 5m."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency > 500ms"
          description: "95th-percentile request latency has exceeded 500ms for 10m."

      - alert: FeatureDrift
        expr: max(mlf_feature_psi) > 0.2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Input feature drift (PSI > 0.2)"
          description: "A feature's PSI vs the training reference exceeds 0.2 — consider retraining."

      - alert: NoPredictions
        expr: sum(rate(mlf_predictions_total[10m])) == 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No predictions served"
          description: "The API has served no predictions in 10m — possible upstream outage."

      - alert: ApiDown
        expr: up{job="kubernetes-pods"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Inference API target down"
          description: "Prometheus cannot scrape the API for 2m."
