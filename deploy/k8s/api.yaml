apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-framework-config
  namespace: ml-framework
data:
  MLFLOW_TRACKING_URI: "http://mlflow:5000"
  MODEL_NAME: "ml-framework"
  REGISTRY_STAGE: "production"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-framework-api
  namespace: ml-framework
  labels:
    app: ml-framework-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-framework-api
  template:
    metadata:
      labels:
        app: ml-framework-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ml-framework-serve:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # mlflow downloads the model bundle at startup
            capabilities:
              drop: ["ALL"]
          command: ["mlf", "serve"]
          args:
            - "--registry-model"
            - "$(MODEL_NAME)"
            - "--registry-stage"
            - "$(REGISTRY_STAGE)"
            - "--tracking-uri"
            - "$(MLFLOW_TRACKING_URI)"
            - "--workers"
            - "2"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          envFrom:
            - configMapRef:
                name: ml-framework-config
          env:
            # API key injected from the Secret (never in the manifest).
            - name: MLF_API_KEY
              valueFrom:
                secretKeyRef: { name: ml-framework-secrets, key: MLF_API_KEY }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: ml-framework-api
  namespace: ml-framework
  labels:
    app: ml-framework-api
spec:
  selector:
    app: ml-framework-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-framework-api
  namespace: ml-framework
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: ml-framework.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-framework-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-framework-api
  namespace: ml-framework
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-framework-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
