# Production posture for the ml-framework namespace: quotas, defaults, disruption
# budget, and default-deny network policy with targeted allows.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ml-framework-quota
  namespace: ml-framework
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ml-framework-limits
  namespace: ml-framework
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-framework-api
  namespace: ml-framework
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-framework-api
---
# Default-deny all ingress in the namespace; specific allows follow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ml-framework
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# Allow the ingress controller + Prometheus to reach the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress
  namespace: ml-framework
spec:
  podSelector:
    matchLabels:
      app: ml-framework-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}      # ingress controller (tighten to its namespace label)
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 8000
---
# Allow MLflow + MinIO to be reached from inside the namespace (api → mlflow → minio).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: ml-framework
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["mlflow", "minio"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}            # any pod in this namespace
