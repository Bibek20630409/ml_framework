# TEMPLATE — copy to secrets.yaml, set real values, then `kubectl apply -f secrets.yaml`.
# secrets.yaml is gitignored and NOT part of the kustomization (never commit real creds).
# In production use sealed-secrets, External Secrets Operator, or Vault instead.
apiVersion: v1
kind: Secret
metadata:
  name: ml-framework-secrets
  namespace: ml-framework
type: Opaque
stringData:
  MINIO_ROOT_USER: "minio"
  MINIO_ROOT_PASSWORD: "CHANGE_ME_minio_password"
  AWS_ACCESS_KEY_ID: "minio"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_minio_password"
  MLF_API_KEY: "CHANGE_ME_api_key"
