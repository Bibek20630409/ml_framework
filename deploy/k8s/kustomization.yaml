# Deploy the whole platform:  kubectl apply -k deploy/k8s
# Validate without a cluster:  kubectl kustomize deploy/k8s   (or: kustomize build deploy/k8s)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ml-framework

resources:
  - namespace.yaml
  - minio.yaml
  - mlflow.yaml
  - api.yaml
  - monitoring.yaml
  - policies.yaml

# Grafana's dashboard JSON is turned into a ConfigMap the grafana Deployment mounts.
configMapGenerator:
  - name: grafana-dashboard
    files:
      - ../monitoring/grafana/dashboards/ml-framework.json

generatorOptions:
  disableNameSuffixHash: true
