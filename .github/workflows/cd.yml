name: CD

# Build, scan, SBOM, sign, and push the serving image. Deploy is manual/gated.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write        # cosign keyless (OIDC)

env:
  IMAGE: ghcr.io/${{ github.repository }}/serve

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (serve target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: serve
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Vulnerability scan (Trivy — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        if: startsWith(github.ref, 'refs/tags/')
        run: cosign sign --yes ${{ env.IMAGE }}:${{ github.sha }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  deploy:
    needs: build-scan-sign
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production        # requires manual approval (gate)
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Kubernetes
        run: |
          echo "kubectl set image deployment/ml-framework-api api=${IMAGE}:${GITHUB_SHA} -n ml-framework"
          echo "(wire up KUBE_CONFIG secret + real kubectl here)"
