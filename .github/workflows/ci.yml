name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve]"
      - name: Lint
        run: |
          ruff check src tests
          black --check src tests
      - name: Type check
        run: mypy src
      - name: Test
        run: pytest --cov=ml_framework --cov-report=term-missing

  mlops-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          curl -sfLo /usr/local/bin/kustomize https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh || true
      - name: Compile Python pipeline + DAG + load script
        run: |
          python -m py_compile src/ml_framework/pipeline/spark_preprocess.py
          python -m py_compile src/ml_framework/pipeline/contracts.py
          python -m py_compile src/ml_framework/monitoring/drift.py
          python -m py_compile src/ml_framework/monitoring/model_quality.py
          python -m py_compile orchestration/airflow/dags/ml_pipeline.py
          python -m py_compile tests/load/locustfile.py
      - name: Validate all YAML (k8s, compose, dvc, configs)
        run: |
          python - <<'PY'
          import glob, sys, yaml
          files = (glob.glob("deploy/**/*.yaml", recursive=True)
                   + glob.glob("deploy/**/*.yml", recursive=True)
                   + ["dvc.yaml", "params.yaml", "docker-compose.yml"]
                   + glob.glob("configs/*.yaml")
                   + glob.glob("orchestration/**/*.yml", recursive=True))
          bad = []
          for f in files:
              try:
                  list(yaml.safe_load_all(open(f, encoding="utf-8")))
              except Exception as e:
                  bad.append((f, e))
          for f, e in bad:
              print("FAIL", f, e)
          sys.exit(1 if bad else 0)
          PY
      - name: Kustomize build (k8s manifests render)
        run: |
          if command -v kubectl >/dev/null; then kubectl kustomize deploy/k8s > /dev/null && echo "kustomize OK"; fi
      - name: Validate Grafana dashboard JSON
        run: python -c "import json; json.load(open('deploy/monitoring/grafana/dashboards/ml-framework.json'))"
