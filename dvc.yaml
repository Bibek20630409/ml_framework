# DVC pipeline — reproducible, content-addressed stages.
#   dvc repro            → run the whole DAG (preprocess → train)
#   dvc dag              → visualize it
#   dvc status / metrics → what changed / current scores
#
# The Spark preprocess stage needs a JVM (Java 11/17) + pyspark. The train stage
# reads the processed Parquet the datamodule now understands.

# `params.yaml` is NOT listed here: DVC loads the repo-root params.yaml into the
# substitution namespace by default, which is what makes `${preprocess.input}`
# and `${train.config}` below resolve with nothing declaring them. Listing it
# again would define those variables twice.
#
# The train config is not a default, so it has to be named. Loading it is what
# lets `${data.path}` resolve to the same value `mlf train` will read — the
# preprocess stage is handed the config rather than a copy of its contents.
vars:
  - configs/dvc_tabular.yaml

stages:
  preprocess:
    cmd: >-
      python -m ml_framework.pipeline.spark_preprocess
      --input ${preprocess.input}
      --config ${train.config}
    deps:
      - ${preprocess.input}
      - ${train.config}
      - src/ml_framework/pipeline/spark_preprocess.py
    # `vars` substitutes but does not track. Both files are declared here so a
    # changed target column or output path actually invalidates this stage
    # instead of silently reusing a cache entry built for the old column.
    params:
      - preprocess
      - configs/dvc_tabular.yaml:
          - data.target
          - data.path
    outs:
      - ${data.path}

  train:
    cmd: mlf train --config ${train.config}
    deps:
      - ${data.path}
      - ${train.config}
      - src/ml_framework
    # Bundle v2 — P3 deleted the v1 root artifacts (model.ckpt/scaler.pkl/
    # metadata.json), which this stage went on declaring for two phases. Nothing
    # caught it: DVC is deliberately not installed locally and CI only *parses*
    # this file.
    #
    # `manifest.json` is the only file a loader must understand; `model/` and
    # `preprocessor/` are what it points at. Listed granularly rather than as the
    # whole `outputs` dir because `metrics.json` lives inside it and DVC will not
    # accept an output nested in another output. The run's audit trail
    # (report.txt, predictions.csv, hpo.json, training.log) is deliberately
    # untracked — it is not what a loader needs, and caching a text report would
    # version it on every run.
    outs:
      - outputs/manifest.json
      - outputs/config.json
      - outputs/model
      - outputs/preprocessor
    metrics:
      - outputs/metrics.json:
          cache: false
